# Docster — auto-update your README on every push (Pro feature).
name: Docster — auto-update README

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  DOCSTER_BACKEND: ${{ vars.DOCSTER_BACKEND_URL || 'https://github-doc-agent-backend.onrender.com' }}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README via Docster
        run: |
          set -euo pipefail
          jq -n \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo  "${{ github.event.repository.name }}" \
            --arg token "${{ secrets.GITHUB_TOKEN }}" \
            --arg branch "${{ github.ref_name }}" \
            '{owner:$owner, repo:$repo, access_token:$token, default_branch:$branch, doc_type:"readme", lang:"en"}' \
            > req.json
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "$DOCSTER_BACKEND/analyze" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DOCSTER_API_KEY }}" \
            --data @req.json)
          if [ "$code" = "401" ] || [ "$code" = "402" ] || [ "$code" = "429" ]; then
            echo "Docster: skipping (HTTP $code) — $(jq -r '.detail // .error // "limit reached or unauthorized"' resp.json)"
            exit 0
          fi
          if [ "$code" != "200" ]; then echo "::error::Docster HTTP $code"; cat resp.json; exit 1; fi
          jq -r '.doc_markdown // .readme_markdown // empty' resp.json > README.md
          [ -s README.md ] || { echo "::error::Docster returned no content"; cat resp.json; exit 1; }

      - name: Open or update a single PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f README.md ] || { echo "Nothing to publish (skipped)."; exit 0; }
          git config user.name  "docster[bot]"
          git config user.email "docster@users.noreply.github.com"
          BRANCH="docster/auto-readme"
          git checkout -B "$BRANCH"
          git add README.md
          if git diff --cached --quiet; then echo "No README change."; exit 0; fi
          git commit -m "docs: auto-update README via Docster [skip ci]"
          git push -f origin "$BRANCH"
          gh pr create \
            --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "docs: auto-update README (Docster)" \
            --body "Generated by Docster on push." \
            || echo "PR already exists — updated."
